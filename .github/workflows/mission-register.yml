name: Mission register consistency
on:
  pull_request:
    paths:
      - 'mission/**'
      - 'tests/test_mission_compiler.py'
      - '.github/workflows/mission-register.yml'
permissions:
  contents: read
jobs:
  offline-record-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_mission_compiler.py' -v
      - run: python -m mission.compiler validate mission/register.json
      - run: python -m mission.compiler certificate mission/register.json
