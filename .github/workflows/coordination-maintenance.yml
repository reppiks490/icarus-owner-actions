name: coordination-maintenance

on:
  push:
    branches: [main]
    paths:
      - 'coordination/sessions/**'
      - 'coordination/events/**'
      - 'coordination/summaries/**'
      - 'coordination/owner_status.json'
      - '.github/workflows/coordination-maintenance.yml'
  schedule:
    # Keep the canonical compiled board fresh within five minutes of new
    # coordination evidence, even when a connector's commit skipped triggers.
    # Offset the cadence so this workflow does not align at minute zero.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Working-tree retention for summarized terminal session events'
        required: false
        default: '14'
        type: string

permissions:
  contents: write

concurrency:
  group: coordination-maintenance-main
  cancel-in-progress: false

jobs:
  compile-and-maintain:
    runs-on: ubuntu-latest
    env:
      RETENTION_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.retention_days || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate requested retention
        shell: bash
        run: |
          set -euo pipefail
          case "$RETENTION_DAYS" in
            ''|*[!0-9]*) echo 'retention_days must be a non-negative integer' >&2; exit 2 ;;
          esac
          if [ "$RETENTION_DAYS" -gt 3650 ]; then
            echo 'retention_days must be between 1 and 3650 when pruning is enabled' >&2
            exit 2
          fi
      - name: Recompute from fresh main, optionally prune, and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'icarus-coordination-bot'
          git config user.email '162067269+reppiks490@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python -m coordination_fabric validate
            if [ "$RETENTION_DAYS" -gt 0 ]; then
              python -m coordination_fabric prune --days "$RETENTION_DAYS"
              python -m coordination_fabric validate
            fi
            python -m coordination_fabric compile
            # Publish collision diagnostics as part of the fresh snapshot. A
            # declared collision is a coordination blocker to display, not a
            # reason to keep publishing stale ACTIVE/index state.
            python -c "import json; d=json.load(open('coordination/collisions.json')); assert isinstance(d.get('collisions'), list)"
            test -f coordination/ACTIVE.md
            test -f coordination/index.json
            test -f coordination/collisions.json
            git add coordination/ACTIVE.md coordination/index.json coordination/collisions.json
            git add -A coordination/events
            if git diff --cached --quiet; then
              echo 'Coordination state already current.'
              exit 0
            fi
            git commit -m "coordination: refresh compiled state retention=${RETENTION_DAYS}d [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during publish attempt $attempt; recomputing from fresh main." >&2
            sleep $((attempt * 2))
          done
          echo 'Unable to publish a fresh coordination snapshot after retries.' >&2
          exit 1
